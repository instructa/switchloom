[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/instructa/switchloom"
homepage = "https://github.com/instructa/switchloom"
documentation = "https://github.com/instructa/switchloom/tree/main/docs"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[package]
name = "model-routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codex model routing and task handoffs with TypeSafe/Jev"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["agents", "routing", "codex"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/catalog.toml",
  "/evaluations/capability-cases.toml",
  "/skills/switchloom/SKILL.md",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
]

[[bin]]
name = "model-routing"
path = "src/main.rs"

[[bin]]
name = "switchloom"
path = "src/bin/switchloom.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
regex-lite = "0.1"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
sha2.workspace = true
ureq = { version = "=3.1.4", default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
