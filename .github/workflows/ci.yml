name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup toolchain install stable --profile minimal
          cargo +stable install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Install website dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: cargo +1.85.0 test --workspace --all-targets --all-features
      - name: Test npm wrapper and release handoff
        run: node --test npm/*.test.mjs scripts/release.test.mjs
      - name: Check website
        run: RUSTUP_TOOLCHAIN=1.85.0 pnpm site:check
      - name: Package
        run: cargo +1.85.0 package --package model-routing --allow-dirty --no-verify
      - name: Audit public package inventories
        run: cargo +1.85.0 run --quiet -p xtask -- release verify --inventory-only
